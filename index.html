/* ---------- Scene 1: heart made of cubes ---------- */
const heartG=new THREE.Group();S.add(heartG);
const P=[];
for(let x=-1.4;x<=1.4;x+=.1)for(let y=-1.2;y<=1.2;y+=.1)for(let z=-1.4;z<=1.4;z+=.1){
 const a=x*x+2.25*y*y+z*z-1;if(a*a*a-x*x*z*z*z-.1125*y*y*z*z*z<0)P.push(x,z,y)}
const N=P.length/3,V=new Float32Array(N*3),RO=new Float32Array(N*3),RV=new Float32Array(N*3);
const cubes=new THREE.InstancedMesh(new THREE.BoxGeometry(.09,.09,.09),new THREE.MeshStandardMaterial({roughness:.35,metalness:.25}),N);
const dm=new THREE.Object3D(),col=new THREE.Color();
for(let i=0;i<N;i++){dm.position.set(P[i*3],P[i*3+1],P[i*3+2]);dm.updateMatrix();cubes.setMatrixAt(i,dm.matrix);
 col.setHSL(.955+Math.random()*.05,.9,.42+Math.random()*.18);cubes.setColorAt(i,col)}
heartG.add(cubes);
let boomT=-1;
function boom(){boomT=T;for(let i=0;i<N;i++){const x=P[i*3],y=P[i*3+1],z=P[i*3+2],l=Math.hypot(x,y,z)||1,f=2+Math.random()*4;
 V[i*3]=x/l*f+(Math.random()-.5)*2;V[i*3+1]=y/l*f+Math.random()*2;V[i*3+2]=z/l*f+Math.random()*4+1;
 RV[i*3]=(Math.random()-.5)*8;RV[i*3+1]=(Math.random()-.5)*8;RV[i*3+2]=(Math.random()-.5)*8}}
function updHeart(dt){
 const hs=Math.min(1,VW/2.9);
 if(boomT<0){const b=1+.07*Math.pow(Math.max(0,Math.sin(T*4)),2);heartG.scale.setScalar(hs*b);heartG.rotation.y=Math.sin(T*.6)*.5;return}
 const t=T-boomT;if(t>2.8){heartG.visible=false;return}
 heartG.scale.setScalar(hs);const f=Math.exp(-.6*dt),sc=cl(1-(t-1.3)/1.4);
 for(let i=0;i<N;i++){V[i*3+1]-=2.4*dt;for(let k=0;k<3;k++){V[i*3+k]*=f;P[i*3+k]+=V[i*3+k]*dt;RO[i*3+k]+=RV[i*3+k]*dt}
  dm.position.set(P[i*3],P[i*3+1],P[i*3+2]);dm.rotation.set(RO[i*3],RO[i*3+1],RO[i*3+2]);dm.scale.setScalar(sc);dm.updateMatrix();cubes.setMatrixAt(i,dm.matrix)}
 cubes.instanceMatrix.needsUpdate=true}

function startMusic(){started=true;$('mute').style.display='block';
 if(SONG_URL){aud=new Audio(SONG_URL);aud.loop=true;aud.volume=.8;aud.play().catch(()=>{});return}
 AC=new(window.AudioContext||window.webkitAudioContext)();AC.resume();master=AC.createGain();master.gain.value=.3;master.connect(AC.destination);
 const d=AC.createDelay(),fb=AC.createGain();d.delayTime.value=.34;fb.gain.value=.38;master.connect(d);d.connect(fb);fb.connect(d);d.connect(AC.destination);
 const f=m=>440*Math.pow(2,(m-69)/12),ch=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],pat=[0,1,2,1,2,1,2,1],mel=[76,74,72,74];
 function note(m,t,du,type,g,att){const o=AC.createOscillator(),e=AC.createGain();o.type=type;o.frequency.value=f(m);
  e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+att);e.gain.exponentialRampToValueAtTime(.0001,t+du);o.connect(e);e.connect(master);o.start(t);o.stop(t+du+.1)}
 let nt=AC.currentTime+.1,bar=0;const bl=3.2;
 setInterval(()=>{while(nt<AC.currentTime+1.5){const c=ch[bar%4];
  c.forEach(m=>note(m,nt,bl,'triangle',.12,.8));note(c[0]-12,nt,bl,'sine',.25,.05);
  pat.forEach((p,i)=>note(c[p]+12,nt+i*bl/8,1.3,'sine',.2,.01));
  note(mel[bar%4]+(bar%8>3?0:0),nt+bl/2,1.8,'triangle',.12,.03);
  nt+=bl;bar++}},400)}
$('mute').onclick=e=>{e.stopPropagation();muted=!muted;$('mute').textContent=muted?'🔇':'🔊';if(master)master.gain.value=muted?0:.3;if(aud)aud.muted=muted};

/* ---------- Flow ---------- */
let T=0,state=0,ts=0,nPhotos=0;
function go(s){state=s;ts=T}
addEventListener('pointerdown',e=>{
 if(e.target.id==='mute')return;
 if(!started)startMusic();
 if(state===0){boom();go(1);showHint(0);setTimeout(()=>{go(2);titleEl.classList.add('on');setTimeout(()=>{if(state===2)showHint('touch to continue')},3200)},1900)}
 else if(state===2&&T-ts>3){go(3);titleEl.classList.remove('on');showHint(0)}
 else if(state===4){go(5);showHint(0);makeRain()}
});

let ready=false;
(async()=>{try{await Promise.race([document.fonts.load('80px "Great Vibes"'),new Promise(r=>setTimeout(r,2500))])}catch(e){}
 const imgs=await Promise.all(IMGS.map(loadImg));
 imgs.forEach((im,i)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(1,680/512),new THREE.MeshBasicMaterial({map:tex(polaroid(im)),transparent:true,opacity:0,depthWrite:false}));
  m.visible=false;m.userData={r:(Math.random()-.5)*.26};S.add(m);cards.push(m)});ready=true})();

const clk=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.05);T+=dt;
 updHeart(dt);updHearts(dt,state>=2);
 if(stk){const show=state===2,p=state===2?cl((T-ts)/1.8):state>2?1:0,fo=state>=3?cl(1-(T-ts)/1):1;
  stk.visible=state>=2&&(state===2||fo>0);
  if(stk.visible){const e=OB(p);stk.material.opacity=cl(p*1.6)*(state===2?1:fo);stk.scale.set(sw*lerp(.55,1,e),sh*lerp(.55,1,e),1);
   stk.position.set(0,-.05*VH+Math.sin(T*1.5)*.06,lerp(-5,0,E(p)));stk.rotation.z=Math.sin(T*1.1)*.03}
  const u=(T-ts-1.8)/4.5;bq.visible=state===2&&u>0;
  if(bq.visible){const k=u%1,m=E(cl((k-.15)/.6));bq.material.opacity=Math.sin(Math.PI*cl(k))>0?cl(Math.sin(Math.PI*k)*2.5):0;
   const s=sw*.34*(.6+.4*cl(k*4));bq.scale.set(s,s,1);
   bq.position.set(lerp(.2*sw,-.14*sw,m),-.05*VH+lerp(-.1*sh,.02*sh,m)+.28*sh*Math.sin(Math.PI*m)+.05*sh,.5)}}
 if(ready){
  if(state===3){const t=T-ts;cards.forEach((m,i)=>{m.visible=true;const p=cl((t-i*.9)/1.4),e=E(p);
    m.scale.set(cw,cw,1);m.material.opacity=cl(p*3);m.position.set(lerp(-VW/2-cw,TG[i][0],e),TG[i][1]+(1-e)*.4,i*.02);m.rotation.z=lerp(-.7,m.userData.r,e)});
   if(t>4*.9+1.6)go(4),showHint('touch once more')}
  else if(state===4||state>=6){cards.forEach((m,i)=>{if(state>=6)return;m.position.set(TG[i][0],TG[i][1]+Math.sin(T*1.2+i*1.3)*.05,i*.02);m.rotation.z=m.userData.r+Math.sin(T*.8+i)*.015})}
  else if(state===5){const t=T-ts;cards.forEach((m,i)=>{const p=cl((t-i*.12)/1.1);m.position.z=i*.02-p*9;m.material.opacity=1-p;m.scale.set(cw*(1-.4*p),cw*(1-.4*p),1);if(p>=1)m.visible=false});
   const rt=t-.9;rain.forEach((r,i)=>{const p=cl((rt-r.d)/r.du),e=E(p);
    r.m.position.set(r.x,lerp(VH/2+r.th,r.ty,e)+(p>=1?Math.sin(T*1.4+i)*.04:0),1+i*.01);r.m.material.opacity=cl(p*4)*(.6+.4*r.sc)})}
 }
 R.render(S,C)}
addEventListener('resize',resize);resize();loop();
</script></body></html>
